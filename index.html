<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسمك الثلاثي | السيرة الذاتية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--ink:#10243a;--muted:#51667c;--accent:#0f7b6c;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a26;--ink:#e8eef4;--muted:#9fb2c4;--accent:#3cc6b0;--card:#152636}}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
main{max-width:720px;margin:0 auto;padding:56px 20px}
h1{font-size:clamp(2.2rem,7vw,3.6rem);margin:0;font-weight:800}
.role{color:var(--accent);font-size:1.2rem;font-weight:700;margin:4px 0 20px}
section{margin-top:44px}
h2{font-size:1.3rem;border-inline-start:4px solid var(--accent);padding-inline-start:12px}
.skills{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none}
.skills li{background:var(--card);padding:6px 14px;border-radius:999px;font-size:.95rem}
a.btn{display:inline-block;background:var(--accent);color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none;font-weight:700;margin-inline-end:8px}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
p{color:var(--muted);max-width:60ch}
</style>
</head>
<body>
<main>
<h1>مصطفى احمد</h1>
<div class="role">طالب تقنية معلومات | جامعة مينسوتا</div>
<p>.</p>

<section>
<h2>المهارات</h2>
<ul class="skills">
<li>HTML و CSS</li><li>GitHub</li><li>Cloudflare Pages</li><li>أدوات الذكاء الاصطناعي</li>
</ul>
</section>

<section>
<h2>تواصل معي</h2>
<a class="btn" href="mailto:you@example.com">راسلني</a>
<a class="btn" href="https://github.com/your-username">GitHub</a>
</section>
</main>
</body>
</html>
